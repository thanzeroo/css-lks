<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Daerah Kabupaten Bandung - Kontak</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- Header / Banner -->
    <div class="header">
        <div class="logo-container">
            <img src="../src/img 1x1.jpeg" alt="Logo" class="logo">
            <h1>Perpustakaan Daerah Kabupaten Bandung</h1>
        </div>
    </div>

    <!-- Navigasi / Menu -->
    <div class="navbar">
        <ul>
            <li><a href="../index.html">Beranda</a></li>
            <li><a href="book list.html">Buku</a></li>
            <li><a href="contact.html" class="active">Kontak</a></li>
        </ul>
    </div>

    <!-- Konten Utama -->
    <main class="content">
        <h2>Hubungi kami</h2>

        <form class="contact-form">
            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama">
            </div>

            <div class="form-group">
                <label for="pesan">Pertanyaan:</label>
                <textarea id="pesan" name="pesan" rows="8"></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit</button>
        </form>
    </main>

</body>
</html>
